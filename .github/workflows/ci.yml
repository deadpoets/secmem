name: CI

# Three Go modules live in this repo: the core (repo root), secmem-crypto/, and
# the secmem-lint analyzer. Go's ./... pattern does not cross module boundaries,
# so the library jobs run their steps once per library module — job names stay
# stable for branch protection. secmem-lint has its own job, which also dogfoods
# the analyzer over the two library modules.
#
# secmem-crypto's go.mod requires the released secmem tag (no replace directive,
# so the module is consumable outside this checkout). In-repo, every Go job runs
# the local setup-workspace action first: it creates a go.work so crypto builds
# and tests against the sibling core tree at this commit rather than the pinned
# release — a core change is exercised against its dependents before it is tagged.
#
# examples/ is a fourth, illustrative module (runnable programs, not published).
# Unlike the library modules it pins core + crypto via replace directives, so it
# builds against this checkout WITHOUT the workspace: its job runs with GOWORK=off
# and skips setup-workspace (which would write a go.work that omits examples). The
# ssh-agent example is unix-only, so the examples job is Linux-only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned to an exact patch, not the "1.26" minor line, because the floating
  # form resolves through actions/setup-go's version manifest, which lags a Go
  # release by up to a day. On 2026-08-16 that gap put every job on go1.26.5
  # while GO-2026-5972 (encoding/asn1 recursion depth) and GO-2026-6218
  # (net/url resolvePath) were already fixed in go1.26.6 — and the asn1 one is
  # REACHABLE from secmem-crypto's ssh signing path, so the vuln job was
  # correctly red on a toolchain we could not float our way off. setup-go
  # fetches an exact version straight from the Go dist site when the manifest
  # does not have it yet, so pinning is also what makes CI reproducible.
  # Bump deliberately when a patch release lands.
  GO_VERSION: "1.26.6"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: secmem-crypto

  test-arm64-linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: secmem-crypto

  # Exercise the GOEXPERIMENT=runtimesecret build. The register/stack/heap
  # erasure layer's integration tests are build-tag-gated to this experiment;
  # without this job they never run in automation. linux/amd64 and linux/arm64
  # only — the experiment's supported platforms.
  test-runtimesecret:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      GOEXPERIMENT: runtimesecret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: secmem-crypto

  # Execute (not just compile) the suite on 32-bit x86. The wipe helpers
  # manipulate big.Word limbs, whose width differs on 386, so 386 must be RUN,
  # not merely built. 386 binaries execute natively on the amd64 runner via the
  # kernel's IA-32 emulation; CGO is off, so no 32-bit libc is needed. The race
  # detector requires 64-bit, so this job runs without -race.
  test-386-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - name: test (core)
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test ./...
      - name: test (secmem-crypto)
        working-directory: secmem-crypto
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test ./...

  # Run the AllocsPerRun no-heap-escape gates on the primary 64-bit targets.
  # They are //go:build !race (alloc counts are not meaningful under the race
  # detector), so the -race jobs skip them and only test-386-linux would
  # otherwise run them — but OpenInto's GCM path is assembly on amd64/arm64 and
  # generic on 386, so the deployed architectures must run the gates too.
  test-noescape:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - run: go test -run TestNoHeapEscape ./...
      - run: go test -run TestNoHeapEscape ./...
        working-directory: secmem-crypto

  # secmem-lint: the borrowing-closure analyzer (its own module, x/tools only).
  # Runs its analysistest suite, then dogfoods it — the library must pass its own
  # analyzer, with the intentional egresses carrying //nolint:secmem-lint.
  secmem-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - name: test analyzer
        working-directory: secmem-lint
        run: go test ./...
      - name: build vettool
        working-directory: secmem-lint
        run: go build -o "$RUNNER_TEMP/secmem-lint" ./cmd/secmem-lint
      - name: dogfood core
        run: go vet -vettool="$RUNNER_TEMP/secmem-lint" ./...
      - name: dogfood secmem-crypto
        working-directory: secmem-crypto
        run: go vet -vettool="$RUNNER_TEMP/secmem-lint" ./...

  # The runnable examples (examples/) — the illustrative module. It resolves core
  # and crypto through replace directives, so it builds against this checkout with
  # GOWORK=off and does NOT use setup-workspace (which would write a go.work that
  # omits examples). The ssh-agent example is unix-only, so this job is Linux-only:
  # it vets, race-tests (the agent's x/crypto/ssh/agent interop suite), and holds
  # the example code to the same golangci-lint + staticcheck gate as the library.
  examples:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: vet + race test
        working-directory: examples
        run: |
          go vet ./...
          go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: examples
      - name: staticcheck (examples)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: latest
          install-go: false
          working-directory: examples
          cache-key: examples

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: arm64
          # 32-bit Windows: the only build where a uint32 bound written as
          # int(^uint32(0)) overflows int. Nothing else in the matrix is both
          # windows and 32-bit, so without this row that break ships.
          - goos: windows
            goarch: "386"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./...
          cd secmem-crypto && go build ./...
      - name: compile test binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go test -c -o /dev/null .
          cd secmem-crypto && go test -c -o /dev/null .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace

      # A workflow file with an invalid expression does not fail loudly. GitHub
      # refuses to start the workflow, records a zero-job run against a push,
      # and shows NOTHING on any pull request's checks. On 2026-08-19 that
      # silently disabled the Windows race soak — the only live lead on the open
      # runtime-corruption defect — for a full day, while every PR in that span
      # reported 22/22 green. A workflow that cannot start looks exactly like a
      # workflow that has nothing to say.
      #
      # shellcheck and pyflakes integration are off deliberately: this step
      # exists to prove the workflow FILES parse and their expressions resolve.
      # Folding in two more linters would make it fail for unrelated reasons,
      # and a noisy required check is one somebody eventually removes.
      - name: actionlint (workflow files parse and expressions resolve)
        env:
          GOWORK: "off" # tool install, not a workspace build
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: secmem-crypto
      - name: staticcheck (core)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: latest
          install-go: false
      - name: staticcheck (secmem-crypto)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: latest
          install-go: false
          working-directory: secmem-crypto
          cache-key: secmem-crypto
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: secmem-lint
      - name: staticcheck (secmem-lint)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: latest
          install-go: false
          working-directory: secmem-lint
          cache-key: secmem-lint

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      # Pinned, and pinning costs nothing here: govulncheck reads the advisory
      # data from https://vuln.go.dev at RUN time (`govulncheck -db`), so the
      # binary version does not gate freshness — a pinned scanner still sees an
      # advisory published this morning. What pinning buys is that CI executes a
      # known binary rather than whatever this module published today, which is
      # the same reason this repo has sha_pinning_required for Actions. Bump
      # deliberately to pick up detection improvements.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...
      - run: govulncheck ./...
        working-directory: secmem-crypto
      - run: govulncheck ./...
        working-directory: secmem-lint

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # API-compatibility radar: gorelease diffs each module's exported API against
  # its latest published tag and posts the report to the job summary, so an
  # unintended breaking change is a reviewed decision instead of a silent ship.
  # Report-only while the modules are 0.x (see the script's header for why a
  # hard gate would deadlock) — flip to a required, failing check at v1.0.
  apicompat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gorelease needs the release tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      # Deliberately NOT pinned, unlike govulncheck above. golang.org/x/exp
      # publishes no semantic tags at all — `go list -m -versions` returns an
      # empty set — so the only thing to pin to is an opaque pseudo-version
      # (v0.0.0-<date>-<sha>). A pin nobody can read, nobody will bump, and that
      # rots invisibly is worse than an honest float: it looks like a control
      # while being an unmaintained constant. The exposure it buys back is small
      # and bounded — this job holds a read-only GITHUB_TOKEN on a public repo
      # with zero repository secrets, and apicompat is report-only. Revisit if
      # x/exp ever starts tagging.
      - run: go install golang.org/x/exp/cmd/gorelease@latest
      - name: core
        run: bash .github/scripts/apicompat.sh . ''
      - name: secmem-crypto
        run: bash .github/scripts/apicompat.sh secmem-crypto 'secmem-crypto/'
      - name: secmem-lint
        run: bash .github/scripts/apicompat.sh secmem-lint 'secmem-lint/'
