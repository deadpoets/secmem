name: CI

# Three Go modules live in this repo: the core (repo root), secmem-crypto/, and
# the secmem-lint analyzer. Go's ./... pattern does not cross module boundaries,
# so the library jobs run their steps once per library module — job names stay
# stable for branch protection. secmem-lint has its own job, which also dogfoods
# the analyzer over the two library modules.
#
# secmem-crypto's go.mod requires the released secmem tag (no replace directive,
# so the module is consumable outside this checkout). In-repo, every Go job runs
# the local setup-workspace action first: it creates a go.work so crypto builds
# and tests against the sibling core tree at this commit rather than the pinned
# release — a core change is exercised against its dependents before it is tagged.
#
# examples/ is a fourth, illustrative module (runnable programs, not published).
# Unlike the library modules it pins core + crypto via replace directives, so it
# builds against this checkout WITHOUT the workspace: its job runs with GOWORK=off
# and skips setup-workspace (which would write a go.work that omits examples). The
# ssh-agent example is unix-only, so the examples job is Linux-only.

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a stacked PR (base = the branch
  # beneath it) must be checked before it retargets to main on merge, or the
  # first run it ever gets is the one that gates the merge.
  pull_request:

permissions:
  contents: read

env:
  # Pinned to an exact patch, not the "1.26" minor line, because the floating
  # form resolves through actions/setup-go's version manifest, which lags a Go
  # release by up to a day. On 2026-08-16 that gap put every job on go1.26.5
  # while GO-2026-5972 (encoding/asn1 recursion depth) and GO-2026-6218
  # (net/url resolvePath) were already fixed in go1.26.6 — and the asn1 one is
  # REACHABLE from secmem-crypto's ssh signing path, so the vuln job was
  # correctly red on a toolchain we could not float our way off. setup-go
  # fetches an exact version straight from the Go dist site when the manifest
  # does not have it yet, so pinning is also what makes CI reproducible.
  # Bump deliberately when a patch release lands.
  #
  # Two toolchains, two tiers. Go supports its two newest releases and the
  # modules declare the older one as their floor (go.mod's `go` directive),
  # so both are tested — but not everywhere. Every job runs on GO_VERSION,
  # the newest. The jobs whose answer depends on the toolchain — the test
  # suite, the runtimesecret build, the no-heap-escape gates and the residue
  # scans, which reflect into standard-library internals and measure what a
  # given runtime leaves behind — also run on GO_VERSION_OLDSTABLE, on one
  # runner per platform, as a matrix leg named "[oldstable]". Lint, the
  # vulnerability and secret scans, cross-compilation, API compatibility,
  # the examples and the 386/arm64 lanes would say nothing new on the second
  # toolchain and run once. When a new Go release ships, GO_VERSION moves to
  # it, GO_VERSION_OLDSTABLE to the release it displaces, and go.mod's floor
  # to the latter's minor. The leg's name is a fixed label, not the version,
  # so a patch bump never renames a required check.
  GO_VERSION: "1.27.1"
  GO_VERSION_OLDSTABLE: "1.26.8"

jobs:
  # Skip audit. A plain `go test` prints nothing for a t.Skip, so a proof that
  # stopped running on a runner looked exactly like one that passed. Every step
  # that runs a proof therefore goes through internal/skipaudit: `go test
  # -json` piped into the audit, which prints each skipped test with its
  # reason and fails the job on any skip that is not on the lane's allowlist
  # (.github/skip-allowlist/), on any failure, and when no test ran at all —
  # so a test renamed out from under a -run pattern fails instead of passing
  # as "no tests to run". Audited, via ./.github/actions/test-audited: every
  # test step of test, test-arm64-linux, test-runtimesecret, test-386-linux,
  # test-noescape, test-residue and test-residue-windows. Audited by the same
  # program fed through test2json: test-root-linux, where only the test binary
  # may run under sudo. argon2-workspace-ran, run by test and test-arm64-linux,
  # is the one other check on skipping: it re-runs the locked Argon2 workspace
  # tests verbosely and fails on any SKIP and on a -run pattern that no
  # passing test matched (ScrubClearsVectorRegs is required only on amd64,
  # the sole architecture whose files define it).
  #
  # The remaining `go test` runs — four steps in three jobs — are plain and
  # NOT audited, on purpose:
  #   - released-deps, both steps: its question is whether the module graph
  #     RESOLVES and builds as a consumer would see it (GOWORK=off, the
  #     published core tag). The test files it runs are the same ones `test`
  #     (with -race) and secmem-lint run on the same runner image, and it
  #     does not lift the memlock limit, so the full-profile locked Argon2
  #     workspace test skips there by design; auditing it would mean an
  #     allowlist for a lane that proves nothing about skipping.
  #   - secmem-lint "test analyzer": analysistest over testdata, asserting
  #     diagnostics rather than runtime protections. Its one t.Skip is the
  #     method-table guard's, taken only when the sibling modules are not
  #     beside it, which a checkout of this repo never is.
  #   - examples "vet + race test": the illustrative module, outside the
  #     workspace; its tests are the ssh-agent's x/crypto/ssh/agent interop
  #     and availability suites and the password-login timing tests, none
  #     uses t.Skip, and no protection claim rests on it.
  test:
    name: test (${{ matrix.os }})${{ matrix.go == 'oldstable' && ' [oldstable]' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          - { os: ubuntu-latest, go: oldstable }
          - { os: windows-latest, go: oldstable }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'oldstable' && env.GO_VERSION_OLDSTABLE || env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/test-audited
        with:
          allowlist: ${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'windows' }}
      # The general-purpose register clear's proof is //go:build !race: the
      # race detector's instrumentation overwrites the registers between the
      # probe's fill and dump. Run it without -race on every target.
      - name: register clear proofs (no -race)
        uses: ./.github/actions/test-audited
        with:
          allowlist: ${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'windows' }}
          args: "-count=1 -run '^(TestScrub_ClearsGeneralPurposeRegisters|TestBorrowPaths_ClearRegistersOnReturn)$'"
      - uses: ./.github/actions/test-audited
        with:
          working-directory: secmem-crypto
          allowlist: ${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'windows' }}
          memlock: unlimited
      - uses: ./.github/actions/argon2-workspace-ran

  test-arm64-linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/test-audited
        with:
          allowlist: linux
      - name: register clear proofs (no -race)
        uses: ./.github/actions/test-audited
        with:
          allowlist: linux
          args: "-count=1 -run '^(TestScrub_ClearsGeneralPurposeRegisters|TestBorrowPaths_ClearRegistersOnReturn)$'"
      - uses: ./.github/actions/test-audited
        with:
          working-directory: secmem-crypto
          allowlist: linux
          memlock: unlimited
      - uses: ./.github/actions/argon2-workspace-ran

  # Exercise the GOEXPERIMENT=runtimesecret build. The register/stack/heap
  # erasure layer's integration tests are build-tag-gated to this experiment;
  # without this job they never run in automation. linux/amd64 and linux/arm64
  # only — the experiment's supported platforms.
  test-runtimesecret:
    name: test-runtimesecret (${{ matrix.runner }})${{ matrix.go == 'oldstable' && ' [oldstable]' || '' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        go: [stable]
        include:
          - { runner: ubuntu-latest, go: oldstable }
    runs-on: ${{ matrix.runner }}
    env:
      GOEXPERIMENT: runtimesecret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'oldstable' && env.GO_VERSION_OLDSTABLE || env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/test-audited
        with:
          allowlist: linux
      - name: register clear proofs (no -race)
        uses: ./.github/actions/test-audited
        with:
          allowlist: linux
          args: "-count=1 -run '^(TestScrub_ClearsGeneralPurposeRegisters|TestBorrowPaths_ClearRegistersOnReturn)$'"
      - uses: ./.github/actions/test-audited
        with:
          working-directory: secmem-crypto
          allowlist: linux
          memlock: unlimited

  # Execute (not just compile) the suite on 32-bit x86. The wipe helpers
  # manipulate big.Word limbs, whose width differs on 386, so 386 must be RUN,
  # not merely built. 386 binaries execute natively on the amd64 runner via the
  # kernel's IA-32 emulation; CGO is off, so no 32-bit libc is needed. The race
  # detector requires 64-bit, so this job runs without -race.
  test-386-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - name: test (core)
        uses: ./.github/actions/test-audited
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        with:
          allowlist: linux-386
          args: ""
      - name: test (secmem-crypto)
        uses: ./.github/actions/test-audited
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        with:
          working-directory: secmem-crypto
          allowlist: linux-386
          memlock: unlimited
          args: ""

  # Run the //go:build !race allocation proofs on the primary 64-bit targets.
  # Alloc counts and the memory profile are not meaningful under the race
  # detector, so the -race jobs do not compile those files and only
  # test-386-linux would otherwise run them. But the code they measure differs
  # by target: OpenInto's GCM path and the SHA-2 block functions are assembly
  # on amd64/arm64 and generic on 386, and the standard library under the
  # parser and marshal proofs changes with the toolchain, so the deployed
  # targets must run them too: linux/amd64 on both toolchains, linux/arm64,
  # and windows/amd64 on both toolchains.
  #
  # The core step selects its gates by name (its other !race proofs, the
  # register clears, have their own step in the test jobs). The secmem-crypto
  # step runs the WHOLE suite without -race instead of a -run pattern: a
  # pattern is how the classification, parser and marshal proofs once ran on
  # no 64-bit lane at all, and a new !race file is covered here without
  # anyone remembering to widen it. The residue scans are skipped by name
  # because they have their own lanes, with their own (empty) allowlists.
  # Audited like every other proof, and a run with no test events fails.
  test-noescape:
    name: test-noescape (${{ matrix.runner }})${{ matrix.go == 'oldstable' && ' [oldstable]' || '' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        go: [stable]
        include:
          - { runner: ubuntu-latest, go: oldstable }
          - { runner: windows-latest, go: stable }
          - { runner: windows-latest, go: oldstable }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'oldstable' && env.GO_VERSION_OLDSTABLE || env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - name: no-heap-escape gates (core)
        uses: ./.github/actions/test-audited
        with:
          allowlist: ${{ runner.os == 'Linux' && 'linux' || 'windows' }}
          args: "-count=1 -run TestNoHeapEscape"
      # memlock: without -run the locked Argon2 workspace tests run here too,
      # and they skip under a hosted runner's default limit.
      - name: allocation proofs, whole suite without -race (secmem-crypto)
        uses: ./.github/actions/test-audited
        with:
          working-directory: secmem-crypto
          allowlist: ${{ runner.os == 'Linux' && 'linux' || 'windows' }}
          memlock: unlimited
          args: "-count=1 -skip '^(TestKeyResidue|TestResidue)'"

  # The out-of-process key residue proof (secmem-crypto/residue_test.go and
  # its per-OS halves): a parent freezes a victim subprocess and scans its
  # whole address space for every encoding of each entry point's key, which is
  # what the README's protection table is measured against. It is //go:build !race — the race
  # detector's shadow reservations make an address-space scan meaningless —
  # so none of the -race jobs above run it. Both build modes on both deployed
  # architectures, because what a transient entry point leaves behind is
  # exactly what runtime/secret changes; audited against an empty allowlist,
  # because a skipped scan is an unproven table row.
  test-residue:
    name: test-residue (${{ matrix.runner }}${{ matrix.goexperiment && format(', {0}', matrix.goexperiment) || '' }})${{ matrix.go == 'oldstable' && ' [oldstable]' || '' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        goexperiment: ["", runtimesecret]
        go: [stable]
        include:
          - { runner: ubuntu-latest, goexperiment: "", go: oldstable }
          - { runner: ubuntu-latest, goexperiment: runtimesecret, go: oldstable }
    runs-on: ${{ matrix.runner }}
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'oldstable' && env.GO_VERSION_OLDSTABLE || env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/test-audited
        with:
          working-directory: secmem-crypto
          allowlist: linux-residue
          memlock: unlimited
          args: "-count=1 -run ^TestKeyResidue$"

  # The same proof on windows/amd64, where the scan is a different mechanism:
  # every thread of the victim is suspended to freeze it, VirtualQueryEx and
  # ReadProcessMemory read it, and QueryWorkingSetEx answers per page whether
  # the kernel has it locked. It runs the locked-page control too, which pins
  # that answer — without it the scan could call every page locked and find
  # nothing anywhere. There is no GOEXPERIMENT=runtimesecret here (it is
  # linux/amd64 and linux/arm64 only), so one lane covers the platform.
  test-residue-windows:
    name: test-residue-windows${{ matrix.go == 'oldstable' && ' [oldstable]' || '' }}
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'oldstable' && env.GO_VERSION_OLDSTABLE || env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/test-audited
        with:
          working-directory: secmem-crypto
          allowlist: windows-residue
          args: "-count=1 -run '^(TestKeyResidue|TestResidueLockedPages_.*)$'"

  # The isolation proofs as ROOT. memfd_secret's claim is that the pages are
  # unreadable through /proc/<pid>/mem and process_vm_readv even by a reader
  # with every permission; the ordinary test job proves it from an
  # unprivileged parent, which Yama would let read its child anyway. This
  # lane re-runs the same proofs under sudo, where the tests treat every
  # environmental skip as a failure (root has nothing to be refused) — the
  # control marker must be recovered and the secret must not — and runs the
  # KSM opt-out proof, whose PR_SET_MEMORY_MERGE needs CAP_SYS_RESOURCE. The
  # test binary is built unprivileged and only the binary runs as root, so
  # root never touches the Go caches; its output is framed by test2json and
  # audited against an EMPTY allowlist: nothing may skip here.
  test-root-linux:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off" # the core module alone; no sibling resolution needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build the test binary and the audit (unprivileged)
        run: |
          go test -c -o "$RUNNER_TEMP/secmem.test" .
          go build -o "$RUNNER_TEMP/skipaudit" ./internal/skipaudit
      - name: isolation, extraction and madvise proofs as root
        run: |
          set -o pipefail
          echo "kernel $(uname -r); memfd_secret and ptrace as euid $(sudo id -u)"
          sudo "$RUNNER_TEMP/secmem.test" -test.v=test2json -test.count=1 \
              -test.run 'Extraction|Isolation|MemfdSecret|Madvise' \
            | go tool test2json -t -p github.com/deadpoets/secmem \
            | "$RUNNER_TEMP/skipaudit" -allow .github/skip-allowlist/linux-root.txt

  # The dependent modules against what is actually PUBLISHED. Every other Go
  # job runs under setup-workspace, which resolves secmem-crypto's core
  # dependency from the sibling tree — so a crypto change that needs core API
  # newer than the tag its go.mod names builds green everywhere and breaks
  # for anyone who `go get`s it. release.sh checks this at release time; this
  # job checks it on every PR, with GOWORK=off and no go.work written, so the
  # module is built and tested exactly as a consumer would build it.
  # secmem-lint has no in-repo dependency, and is included so that stays true
  # by test rather than by memory.
  released-deps:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: secmem-crypto against the released core tag
        working-directory: secmem-crypto
        run: |
          test ! -f ../go.work || { echo "::error::a go.work is present; this job must run without one"; exit 1; }
          go list -m github.com/deadpoets/secmem
          go mod verify
          go vet ./...
          go test -count=1 ./...
      - name: secmem-lint without a workspace
        working-directory: secmem-lint
        run: |
          go mod verify
          go vet ./...
          go test -count=1 ./...

  # secmem-lint: the borrowing-closure analyzer (its own module, x/tools only).
  # Runs its analysistest suite, then dogfoods it — the library AND the examples
  # (the code people copy) must pass its own analyzer, with the intentional
  # egresses carrying //nolint:secmem-lint. examples/ is outside the workspace
  # setup-workspace writes, so it is vetted with GOWORK=off like its own job.
  secmem-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - name: test analyzer
        working-directory: secmem-lint
        run: go test ./...
      - name: build vettool
        working-directory: secmem-lint
        run: go build -o "$RUNNER_TEMP/secmem-lint" ./cmd/secmem-lint
      - name: dogfood core
        run: go vet -vettool="$RUNNER_TEMP/secmem-lint" ./...
      - name: dogfood secmem-crypto
        working-directory: secmem-crypto
        run: go vet -vettool="$RUNNER_TEMP/secmem-lint" ./...
      - name: dogfood examples
        working-directory: examples
        env:
          GOWORK: "off"
        run: go vet -vettool="$RUNNER_TEMP/secmem-lint" ./...

  # The runnable examples (examples/) — the illustrative module. It resolves core
  # and crypto through replace directives, so it builds against this checkout with
  # GOWORK=off and does NOT use setup-workspace (which would write a go.work that
  # omits examples). The ssh-agent example is unix-only, so this job is Linux-only:
  # it vets, race-tests (the agent's interop and availability suites and the
  # password-login timing tests), and holds
  # the example code to the same golangci-lint + staticcheck gate as the library.
  examples:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: vet + race test
        working-directory: examples
        run: |
          go vet ./...
          go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: examples
      - name: staticcheck (examples)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: 2026.2.1
          install-go: false
          working-directory: examples
          cache-key: examples

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: arm64
          # windows/amd64 is executed by the test job, but `go test` runs only
          # a subset of vet's analyzers; this row gives the Windows files the
          # full `go vet` the other targets get.
          - goos: windows
            goarch: amd64
          # 32-bit Windows: the only build where a uint32 bound written as
          # int(^uint32(0)) overflows int. Nothing else in the matrix is both
          # windows and 32-bit, so without this row that break ships.
          - goos: windows
            goarch: "386"
          # Platforms with no secure-memory API at all: the LOUD heap stub
          # (mlock_stub.go, harden_stub.go, sealcipher_other.go, ...) and its
          # fail-closed constructors. Nothing in CI EXECUTES these — they are
          # compile-checked only, which is exactly what the README's "other"
          # column says. Without these rows the stub column was never built.
          - goos: freebsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: wasip1
            goarch: wasm
          # Plan 9 has notes instead of signals and no syscall.Signal; the
          # termination handler once named that type and the whole package
          # failed to build there.
          - goos: plan9
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./...
          cd secmem-crypto && go build ./...
      # vet type-checks the test files too, which `go build` does not.
      # unsafeptr is off: it has no exemption for non-stdlib syscall wrappers,
      # so it flags four sites wherever their files build — the VirtualAlloc
      # conversion on Windows (see the mlock_windows.go header), the two
      # guard-page probes, and the dead-stack read. Each reads memory the GC
      # does not own, or holds the collector off while it reads what it does;
      # `go vet` honours no suppression comment, so the flag is the only way
      # to say so here. golangci-lint carries the same exclusions, scoped by
      # path, and the //nolint:govet comments at those sites say why.
      - name: vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go vet -unsafeptr=false ./...
          cd secmem-crypto && go vet -unsafeptr=false ./...
      - name: compile test binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go test -c -o /dev/null .
          cd secmem-crypto && go test -c -o /dev/null . && go test -c -o /dev/null ./internal/argon2 && go test -c -o /dev/null ./internal/bcryptpbkdf && go test -c -o /dev/null ./internal/scrypt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace

      # A workflow file with an invalid expression does not fail loudly. GitHub
      # refuses to start the workflow, records a zero-job run against a push,
      # and shows NOTHING on any pull request's checks. On 2026-08-19 that
      # silently disabled the Windows race soak — the only live lead on the open
      # runtime-corruption defect — for a full day, while every PR in that span
      # reported 22/22 green. A workflow that cannot start looks exactly like a
      # workflow that has nothing to say.
      #
      # shellcheck and pyflakes integration are off deliberately: this step
      # exists to prove the workflow FILES parse and their expressions resolve.
      # Folding in two more linters would make it fail for unrelated reasons,
      # and a noisy required check is one somebody eventually removes.
      - name: actionlint (workflow files parse and expressions resolve)
        env:
          GOWORK: "off" # tool install, not a workspace build
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: secmem-crypto
      # The two passes above analyse the runner's GOOS, so on their own the
      # Windows and Darwin files (mlock_windows.go, harden_windows.go,
      # sealcipher_windows.go, mlock_darwin.go, ...) are never linted, and
      # .golangci.yml's exclusion for mlock_windows.go is never exercised.
      # golangci-lint type-checks for the GOOS it is given without executing
      # anything; cgo is off so no foreign C toolchain is looked for.
      - name: golangci-lint (core, GOOS=windows)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
          CGO_ENABLED: "0"
        with:
          version: v2.14.0
      - name: golangci-lint (secmem-crypto, GOOS=windows)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
          CGO_ENABLED: "0"
        with:
          version: v2.14.0
          working-directory: secmem-crypto
      - name: golangci-lint (core, GOOS=darwin)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: darwin
          CGO_ENABLED: "0"
        with:
          version: v2.14.0
      - name: golangci-lint (secmem-crypto, GOOS=darwin)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: darwin
          CGO_ENABLED: "0"
        with:
          version: v2.14.0
          working-directory: secmem-crypto
      - name: staticcheck (core)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: 2026.2.1
          install-go: false
      - name: staticcheck (secmem-crypto)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: 2026.2.1
          install-go: false
          working-directory: secmem-crypto
          cache-key: secmem-crypto
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: secmem-lint
      - name: staticcheck (secmem-lint)
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: 2026.2.1
          install-go: false
          working-directory: secmem-lint
          cache-key: secmem-lint

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      # Pinned, and pinning costs nothing here: govulncheck reads the advisory
      # data from https://vuln.go.dev at RUN time (`govulncheck -db`), so the
      # binary version does not gate freshness — a pinned scanner still sees an
      # advisory published this morning. What pinning buys is that CI executes a
      # known binary rather than whatever this module published today, which is
      # the same reason this repo has sha_pinning_required for Actions. Bump
      # deliberately to pick up detection improvements.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...
      - run: govulncheck ./...
        working-directory: secmem-crypto
      - run: govulncheck ./...
        working-directory: secmem-lint

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named explicitly rather than left to auto-detection, so the scan
          # cannot silently fall back to the default rules and start failing
          # on redact's synthetic corpus again. See .gitleaks.toml.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # API-compatibility radar: gorelease diffs each module's exported API against
  # its latest published tag and posts the report to the job summary, so an
  # unintended breaking change is a reviewed decision instead of a silent ship.
  # Report-only while the modules are 0.x (see the script's header for why a
  # hard gate would deadlock) — flip to a required, failing check at v1.0.
  apicompat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gorelease needs the release tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace
      # Deliberately NOT pinned, unlike govulncheck above. golang.org/x/exp
      # publishes no semantic tags at all — `go list -m -versions` returns an
      # empty set — so the only thing to pin to is an opaque pseudo-version
      # (v0.0.0-<date>-<sha>). A pin nobody can read, nobody will bump, and that
      # rots invisibly is worse than an honest float: it looks like a control
      # while being an unmaintained constant. The exposure it buys back is small
      # and bounded — this job holds a read-only GITHUB_TOKEN on a public repo
      # with zero repository secrets, and apicompat is report-only. Revisit if
      # x/exp ever starts tagging.
      - run: go install golang.org/x/exp/cmd/gorelease@latest
      - name: core
        run: bash .github/scripts/apicompat.sh . ''
      - name: secmem-crypto
        run: bash .github/scripts/apicompat.sh secmem-crypto 'secmem-crypto/'
      - name: secmem-lint
        run: bash .github/scripts/apicompat.sh secmem-lint 'secmem-lint/'
