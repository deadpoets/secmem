# CodeQL static analysis over all four Go modules.
#
# build-mode: manual, because Go's extractor supports only autobuild and
# manual (build-mode: none is rejected at init), and autobuild stops at the
# first go.mod — this repo has four. The traced build uses the same go.work
# union as CI, so one `go build ./...` at the root covers core, crypto and
# lint; examples builds separately under GOWORK=off, matching its own CI job.
#
# Go's version comes from go.mod's `toolchain` line rather than a copy of CI's
# GO_VERSION: go-current.sh holds that line equal to the pin, and a second
# copy in this file would be one more site to move.
#
# This also satisfies OpenSSF Scorecard's SAST check, which looks for CodeQL
# runs on recent commits.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 6 * * 1" # weekly, so the default branch never goes stale

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-workspace
      # init and analyze MUST be the same version. analyze's post step reloads
      # the config init wrote and fails on a version mismatch, so a half-applied
      # bump breaks the job rather than degrading it. Dependabot treats the two
      # subpaths as separate dependencies and will bump them in separate PRs —
      # dependabot.yml groups them to stop that.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: go
          build-mode: manual
      - name: build all modules (traced)
        run: |
          go build ./...
          cd examples && GOWORK=off go build ./...
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:go"
