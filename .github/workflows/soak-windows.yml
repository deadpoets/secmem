name: Windows Race Soak

# Hunts a rare runtime-state corruption that CI has seen exactly once and this
# project cannot reproduce locally.
#
# On 2026-08-17, `test (windows-latest)` died with:
#
#     fatal error: stack not a power of 2
#     runtime.stackfree(...)  stack.go:468
#     runtime.gfget(...)      proc.go:5534
#     runtime.newproc1 / newproc  <- testing.(*T).Run
#
# The runtime found a cached goroutine on its free list whose stack size is not
# a power of two — i.e. runtime state that something corrupted. A re-run of the
# same job passed, ~500 local processes never reproduced it, and no upstream Go
# issue matches. For a library whose entire purpose is writing to memory the
# runtime does not manage, "we saw it once and it went away" is not a conclusion
# anyone should accept.
#
# One CI run per PR samples this once. This workflow samples it a few hundred
# times on the same runner image, which is the only place it has ever appeared.
# It is diagnostic tooling, not a gate: nothing depends on it, and a red run here
# is a finding to investigate rather than a broken build.
#
# GOTRACEBACK=system is the point of the exercise — the default traceback elides
# runtime frames, and the runtime frames are the evidence.
#
# SECOND SIGHTING, 2026-08-19 (CI run 32201035150, PR #59):
#
#     fatal error: acquireSudog: found s.elem != nil in cache
#
# Different message, same class, and together they make the signature specific:
# both are per-P runtime FREE-LIST CACHES found in an impossible state — the
# goroutine free list with a non-power-of-two stack size, and the sudog cache
# holding a released sudog whose elem is not nil. In both the crashing frame is
# innocuous (TestCapabilities_String; t.Parallel), so the goroutine is merely
# tripping over damage done earlier. That is a stray WRITE into memory the Go
# runtime owns.
#
# One useful discriminator: the sudog case needs a write that makes a field
# NON-nil, which a plain zero-wipe cannot do. Canary fill (a random pattern) and
# ordinary buffer writes can.
#
# Delete this workflow once the crash is understood. A soak that nobody reads is
# worse than no soak, because it looks like coverage.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily, clear of the 07:00 fuzz run
  workflow_dispatch:
    inputs:
      iterations:
        description: "Test processes to run (each is one full package run)"
        default: "200"
      gomaxprocs:
        description: "GOMAXPROCS per process (runners have 4 CPUs; the crash appeared at the default)"
        default: "4"
      godebug:
        description: "GODEBUG for each process, e.g. clobberfree=1 (empty for none)"
        default: ""
      package:
        description: "Module directory to soak"
        default: "."
      mode:
        description: "gotest = `go test -race ./...` exactly as ci.yml runs it (reproduces); binary = loop one prebuilt package binary (faster, has NOT reproduced)"
        default: "gotest"
      timeout:
        description: "Per-iteration Go test timeout (e.g. 180s). A hang must panic with a full goroutine dump rather than stall silently."
        default: "180s"

permissions:
  contents: read

env:
  # Exact patch, kept in step with ci.yml. The one observation was on 1.26.6,
  # and a soak against a different toolchain would not be evidence about it.
  GO_VERSION: "1.26.6"

jobs:
  soak:
    runs-on: windows-latest
    # Generous but bounded: 200 race-built processes at GOMAXPROCS=4 runs well
    # under an hour, and a hang should not burn a 6-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-workspace

      - name: environment fingerprint
        shell: pwsh
        run: |
          # The crash has only ever appeared on this runner image, never on the
          # maintainer's workstation across ~1190 processes. Measured on
          # 2026-08-19, the two differ in five ways that touch memory layout,
          # scheduling, or what else is writing to the same pages:
          #
          #                        workstation               windows-latest
          #     CPU                Intel Core Ultra 7 265KF  AMD EPYC 7763
          #     logical CPUs       20                        4
          #     mandatory ASLR     ForceRelocateImages ON    off
          #     HVCI               running                   not running
          #     Defender realtime  on                        off
          #
          # Two differences that sounded obvious turned out not to exist: both
          # are build 261xx (Server 2025 is 26100, the workstation 26220), and
          # both run the client scheduler quantum. That is the argument for
          # recording this on every run instead of reasoning about "the runner
          # image" — a hit gets correlated against a CPU model and image version
          # someone actually observed.
          #
          # Note also that GOMAXPROCS=4 does not emulate a 4-CPU machine. It
          # caps Go's Ps while the OS still spreads sysmon, GC workers and the
          # race detector's own threads over every core, so the local samples
          # were never the runner's contention profile.
          #
          # Diagnostic only. Every probe is optional and this step always
          # succeeds — a soak must not go red because a WMI class was missing.
          $ErrorActionPreference = 'Continue'
          $lines = New-Object System.Collections.Generic.List[string]
          function Note([string]$k, $v) { $lines.Add(('{0,-24}: {1}' -f $k, $v)) }
          function Probe([string]$k, [scriptblock]$fn) {
            try { Note $k (& $fn) } catch { Note $k "<unavailable: $($_.Exception.Message)>" }
          }

          Note 'ImageOS'        $env:ImageOS
          Note 'ImageVersion'   $env:ImageVersion
          Probe 'OS' {
            $o = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            "$($o.Caption) build $($o.BuildNumber) (ProductType $($o.ProductType); 1=client, 3=server)"
          }
          Probe 'CPU' {
            $c = @(Get-CimInstance Win32_Processor -ErrorAction Stop)[0]
            "$($c.Name.Trim()) | $($c.NumberOfLogicalProcessors) logical | rev $($c.Revision)"
          }
          Probe 'Hypervisor' {
            (Get-CimInstance Win32_ComputerSystem -ErrorAction Stop).HypervisorPresent
          }
          Probe 'PrioritySeparation' {
            $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' `
                    -Name Win32PrioritySeparation -ErrorAction Stop).Win32PrioritySeparation
            '{0} (0x{0:X}) — client default 2 = short/variable/boost, server default 0x18 = long/fixed' -f $v
          }
          Probe 'Mitigations' {
            $m = Get-ProcessMitigation -System -ErrorAction Stop
            "DEP=$($m.Dep.Enable) ASLR.BottomUp=$($m.Aslr.BottomUp) " +
            "ASLR.ForceRelocate=$($m.Aslr.ForceRelocateImages) " +
            "ASLR.HighEntropy=$($m.Aslr.HighEntropy) CFG=$($m.Cfg.Enable)"
          }
          Probe 'DeviceGuard' {
            $d = Get-CimInstance -Namespace 'root\Microsoft\Windows\DeviceGuard' `
                   -ClassName Win32_DeviceGuard -ErrorAction Stop
            "VBS=$($d.VirtualizationBasedSecurityStatus) (0=off,1=configured,2=running) " +
            "services=$($d.SecurityServicesRunning -join ',') (2=HVCI)"
          }
          Probe 'Defender' {
            $s = Get-MpComputerStatus -ErrorAction Stop
            "RealTimeProtection=$($s.RealTimeProtectionEnabled) Antivirus=$($s.AntivirusEnabled)"
          }
          Probe 'Go' { (go version) -join ' ' }

          $body = $lines -join "`n"
          Write-Host $body
          "## Environment fingerprint`n`n``````text`n$body`n``````" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0

      - name: soak
        shell: bash
        working-directory: ${{ github.event.inputs.package || '.' }}
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '200' }}
          GOMAXPROCS: ${{ github.event.inputs.gomaxprocs || '4' }}
          GODEBUG: ${{ github.event.inputs.godebug || '' }}
          MODE: ${{ github.event.inputs.mode || 'gotest' }}
          TIMEOUT: ${{ github.event.inputs.timeout || '180s' }}
          GOTRACEBACK: system
        run: |
          set -uo pipefail

          # Validate every dispatch input BEFORE it reaches a shell context that
          # can evaluate it.
          #
          # `((i <= ITERATIONS))` is a code-execution sink: bash evaluates array
          # subscripts inside arithmetic, so ITERATIONS='a[$(id>&2)]' runs the
          # substitution. Passing the inputs through `env:` rather than
          # interpolating a github.event.inputs expression straight into the
          # script already closes the YAML-level injection — this closes the
          # arithmetic one, which is the half that remained. Dispatching needs
          # write access, so this is hardening rather than a hole anyone else
          # can reach, but a workflow that evaluates its own inputs is not a
          # thing to leave lying around in a security repo.
          #
          # Do NOT write a literal expression delimiter in these comments, even
          # inside backticks. Actions expands expressions in `run:` before any
          # shell sees the text, so a `#` does not protect it: an empty one is a
          # parse error that takes the whole workflow file down. That is exactly
          # how this file spent 2026-08-19 unable to start — see the actionlint
          # step in ci.yml, which now catches it.
          case "$ITERATIONS" in
            '' | *[!0-9]*) echo "::error title=soak: bad input::iterations must be a positive integer, got '$ITERATIONS'"; exit 1 ;;
          esac
          if [ "$ITERATIONS" -lt 1 ] || [ "$ITERATIONS" -gt 5000 ]; then
            echo "::error title=soak: bad input::iterations must be 1..5000, got $ITERATIONS"; exit 1
          fi
          case "$GOMAXPROCS" in
            '' | *[!0-9]*) echo "::error title=soak: bad input::gomaxprocs must be a positive integer, got '$GOMAXPROCS'"; exit 1 ;;
          esac
          case "$MODE" in
            gotest | binary) ;;
            *) echo "::error title=soak: bad input::mode must be gotest or binary, got '$MODE'"; exit 1 ;;
          esac
          # Go durations only: digits and unit letters, nothing that could be
          # read as another flag.
          case "$TIMEOUT" in
            '' | *[!0-9smh]*) echo "::error title=soak: bad input::timeout must be a Go duration such as 180s, got '$TIMEOUT'"; exit 1 ;;
          esac

          # Two shapes, and the difference turned out to matter.
          #
          # `binary` builds the package test binary once and loops it. It is
          # several times faster per iteration, and it is what this workflow did
          # originally — for 1250 iterations, finding nothing, while two
          # ordinary CI runs reproduced the crash.
          #
          # `gotest` runs `go test -race ./...`, exactly as ci.yml does. That
          # compiles and runs the core and redact test binaries CONCURRENTLY,
          # which is a materially different address-space and allocator story —
          # and for a bug whose signature is a stray write into runtime
          # free-list caches, "what the allocator hands back next" is the whole
          # question. It is the default because it is the only shape that has
          # actually reproduced.
          #
          # Each iteration carries a per-iteration timeout. Without one, a hang
          # produces NOTHING: the job sits until its own 90-minute limit and is
          # killed with no traceback, so the single most interesting outcome
          # after a crash — a deadlock — is the one this workflow could not
          # report. Go's timeout panics and dumps every goroutine, which with
          # GOTRACEBACK=system is exactly the evidence wanted.
          #
          # Compilation happens ONCE, before the loop, and a failure there exits
          # immediately. Left inside the loop it would fail all N iterations
          # identically and be reported as N crashes — a wall of false positives
          # burying the rare real one, and a "failures: 200" line that means the
          # opposite of what it appears to.
          if [ "$MODE" = "binary" ]; then
            echo "::group::build test binary"
            if ! go test -race -c -o soak.exe .; then
              echo "::error title=soak: build failed::the test binary does not compile; not looping"
              exit 1
            fi
            echo "::endgroup::"
            run_once() { ./soak.exe -test.count=1 -test.timeout="$TIMEOUT" 2>&1; }
          else
            echo "::group::compile check"
            if ! go test -race -run '^$' -count=1 -timeout "$TIMEOUT" ./...; then
              echo "::error title=soak: compile failed::the suite does not build; not looping"
              exit 1
            fi
            echo "::endgroup::"
            run_once() { go test -race -count=1 -timeout "$TIMEOUT" ./... 2>&1; }
          fi
          echo "soaking $ITERATIONS iterations, mode=$MODE, GOMAXPROCS=$GOMAXPROCS, GODEBUG='${GODEBUG:-}'"

          failures=0
          runtime_crashes=0
          hangs=0
          data_races=0
          test_failures=0

          # classify says what a failing iteration actually was. The hunt is for
          # runtime-state corruption specifically, and an ordinary flaky
          # assertion counted beside it would make the number meaningless — the
          # whole point of this workflow is a rate for ONE phenomenon.
          # Patterns checked against real output, not guessed: both recorded
          # sightings ("fatal error: stack not a power of 2", "fatal error:
          # acquireSudog: ..."), a real `go test -timeout` panic, and an ordinary
          # t.Fatal.
          classify() {
            case "$1" in
              *"fatal error: "*) echo runtime-crash ;;
              *"panic: test timed out"* | *"test timed out"*) echo hang ;;
              # A race report gets its own bucket: -race finding a genuine write
              # race here would be the best lead available on a bug whose whole
              # signature is a stray write, and it must not be filed beside a
              # flaky assertion.
              *"WARNING: DATA RACE"*) echo data-race ;;
              *) echo test-failure ;;
            esac
          }

          # Pure-bash counter: seq is coreutils and not guaranteed on the
          # runner's Git bash. ITERATIONS is validated as digits above, which is
          # what makes this arithmetic safe.
          for ((i = 1; i <= ITERATIONS; i++)); do
            if ! out=$(run_once); then
              failures=$((failures + 1))
              kind=$(classify "$out")
              case "$kind" in
                runtime-crash) runtime_crashes=$((runtime_crashes + 1)) ;;
                hang) hangs=$((hangs + 1)) ;;
                data-race) data_races=$((data_races + 1)) ;;
                *) test_failures=$((test_failures + 1)) ;;
              esac
              echo "::group::FAILURE ($kind) on iteration $i"
              echo "$out"
              echo "::endgroup::"
              # The first ~40 lines carry the fatal error and the faulting
              # stack; the full traceback is in the group above.
              {
                echo "### iteration $i — $kind"
                echo '```'
                echo "$out" | head -40
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          {
            echo "$failures failures in $ITERATIONS iterations"
            echo "  runtime crashes : $runtime_crashes   <- the phenomenon this workflow hunts"
            echo "  data races      : $data_races   <- would be the best lead yet"
            echo "  hangs (timeout) : $hangs"
            echo "  test failures   : $test_failures"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # A soak that goes green tells us the rate is below what this sample
          # can see — NOT that the bug is gone. Say so, so a green tick here is
          # never mistaken for a clean bill of health.
          if [ "$failures" -eq 0 ]; then
            echo "No failures observed. This bounds the rate; it does not clear the defect." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
