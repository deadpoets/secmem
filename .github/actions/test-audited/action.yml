name: go test with skip audit
description: >-
  Run one module's tests with `go test -json`, piped through
  internal/skipaudit. The audit echoes the ordinary -v output, prints every
  skipped test with its reason, and FAILS the step when a skip is not on the
  runner's allowlist (.github/skip-allowlist/<name>.txt), when any test
  failed, or when no test events arrived at all. A plain `go test` prints
  nothing for a t.Skip, so a proof that stopped running on a runner looked
  exactly like one that passed; this is what makes it visible.
inputs:
  allowlist:
    description: Name of the allowlist under .github/skip-allowlist (without .txt).
    required: true
  working-directory:
    description: Module directory to test.
    default: "."
  args:
    description: Extra `go test` flags, e.g. -race.
    default: "-race"
  memlock:
    description: >-
      "unlimited" raises RLIMIT_MEMLOCK for this step on Linux, for a module
      whose tests need a bigger locked budget than a hosted runner's default
      (secmem-crypto's locked Argon2 workspace). Leave it at "default"
      everywhere else: the core suite has a test that needs a 512 MiB lock to
      FAIL, so raising the limit for it turns a proof into a skip.
    default: "default"
runs:
  using: composite
  steps:
    - name: build skipaudit
      shell: bash
      working-directory: ${{ github.workspace }}
      run: go build -o "$RUNNER_TEMP/skipaudit$(go env GOEXE)" ./internal/skipaudit
    - name: test ${{ inputs.working-directory }} (skips audited against ${{ inputs.allowlist }}.txt)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -o pipefail
        # The hosted Linux runners cap RLIMIT_MEMLOCK below what the locked
        # Argon2 workspace proofs need, and EnsureMemlockLimit cannot raise a
        # hard limit without privilege. The runner user has sudo, so lift it
        # for this shell (children inherit) where the caller asks for it.
        # Only where it asks: the core suite proves NewBuffer wipes its input
        # on an allocation the lock budget REFUSES, so an unlimited budget
        # there replaces a proof with a skip.
        if [ "${{ inputs.memlock }}" = unlimited ] && [ "$(uname -s)" = Linux ] && command -v sudo >/dev/null; then
          sudo prlimit --pid $$ --memlock=unlimited:unlimited || true
        fi
        echo "memlock soft/hard: $(ulimit -Sl) / $(ulimit -Hl)"
        go test ${{ inputs.args }} -json ./... \
          | "$RUNNER_TEMP/skipaudit$(go env GOEXE)" -allow "$GITHUB_WORKSPACE/.github/skip-allowlist/${{ inputs.allowlist }}.txt"
