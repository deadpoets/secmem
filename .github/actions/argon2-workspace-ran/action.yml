name: argon2-workspace tests ran
description: >-
  A skipped test is invisible in a plain `go test` run, and the locked
  Argon2 workspace tests skip on lock refusal by convention (an environment
  condition, per TESTING.md). On a hosted runner that can lock memory a skip
  is therefore a finding, not noise: it means the runner's lock budget or the
  allocator changed and the workspace path silently stopped being tested.
  This step re-runs just those tests verbosely and fails on any SKIP, and on
  any -run pattern that no passing test matched: a renamed test would
  otherwise empty the pattern and the SKIP check would pass over nothing
  (ScrubClearsVectorRegs is required only on amd64, the sole architecture
  whose files define it).
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: secmem-crypto
      run: |
        # The hosted Linux runners cap RLIMIT_MEMLOCK below the 64 MiB the
        # full-profile test needs, and EnsureMemlockLimit cannot raise a hard
        # limit without privilege. The runner user has sudo, so lift it for
        # this shell (children inherit); elsewhere the default suffices.
        if [ "$(uname -s)" = Linux ] && command -v sudo >/dev/null; then
          sudo prlimit --pid $$ --memlock=unlimited:unlimited || true
        fi
        echo "memlock soft/hard: $(ulimit -Sl) / $(ulimit -Hl)"
        out=$(go test -race -count=1 -v -run 'Argon2Workspace|Argon2Pool|ScrubClearsVectorRegs|UpstreamIdentity' ./... 2>&1) || { echo "$out"; exit 1; }
        echo "$out" | grep -E '^(--- |ok|FAIL)'
        if echo "$out" | grep -q -- '--- SKIP'; then
          echo "::error::an Argon2 workspace/register/identity test skipped on this runner; see the lines above"
          exit 1
        fi
        # The other way this check goes quiet: a pattern that matches no test.
        # A rename empties it, `go test` prints "no tests to run" and exits 0,
        # and the SKIP grep above passes over an empty run. So every pattern
        # must also have produced at least one top-level PASS.
        # ScrubClearsVectorRegs lives in amd64-only files
        # (vecclear_amd64_test.go, internal/argon2/scrubclear_amd64_test.go:
        # //go:build amd64 && gc && !purego), so it is required only where it
        # compiles; the arm64 and macOS lanes have no such test to run.
        patterns='Argon2Workspace Argon2Pool UpstreamIdentity'
        if [ "$(go env GOARCH)" = amd64 ]; then
          patterns="$patterns ScrubClearsVectorRegs"
        fi
        for p in $patterns; do
          n=$(echo "$out" | grep -cE "^--- PASS: [^ /]*${p}" || true)
          if [ "$n" -eq 0 ]; then
            echo "::error::no test matching '$p' passed on this runner: the -run pattern matched nothing (renamed test?) — see the lines above"
            exit 1
          fi
          echo "$p: $n test(s) passed"
        done
