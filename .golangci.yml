# golangci-lint configuration for secmem — applied to BOTH modules in this
# repo (golangci-lint finds this file by searching upward from the analyzed
# directory, so runs inside secmem-crypto/ use it too; that includes the
# _test.go exclusions below, accepted deliberately for the crypto module's
# tests as well). CI runs it per module via golangci-lint-action; locally,
# `make lint` loops over both modules. The set is curated, not maximal —
# trust is inversely proportional to surface, tooling included.
version: "2"

linters:
  default: standard # govet, staticcheck, errcheck, ineffassign, unused
  enable:
    - gosec # security analyzer — on-brand for this library
    - bodyclose
    - misspell
    - unconvert
    - unparam
    - nilerr
    - errorlint
    - copyloopvar
    - predeclared

  exclusions:
    # These are the only rule-level suppressions, each for a documented,
    # verified reason — not blanket silence.
    rules:
      # go vet's unsafeptr check has no exemption for non-stdlib syscall
      # wrappers, so converting an OS-owned address (VirtualAlloc) to a
      # pointer is a false positive. See the mlock_windows.go file header.
      - path: mlock_windows\.go
        linters: [govet]
        text: "possible misuse of unsafe.Pointer"

      # Guard-page and dead-stack proof tests deliberately read addresses that
      # are outside any Go object (a fault is the thing under test), which
      # unsafeptr cannot distinguish from a bug.
      - path: (guard_canary_test|fault_probe_test|scrub_amd64_test)\.go
        linters: [govet, gosec]
        text: "(possible misuse of unsafe.Pointer|G103|G304|unsafe)"

      # Verbatim golang.org/x/crypto code carried by the Argon2 fork. The BLAMKA
      # round (RFC 9106 §3.7.1) multiplies the low 32 bits of each 64-bit word,
      # so the uint32 truncation IS the algorithm; BLAKE2b's finalisation widens
      # a 1..64 digest size and a non-negative block remainder. Annotating the
      # lines would bury the diff against upstream that the fork's provenance
      # (and upstream_identity_test.go) rests on.
      - path: internal/argon2/(blamka_generic|blake2b_generic)\.go
        linters: [gosec]
        text: "G115"

      # Verbatim golang.org/x/crypto/blowfish carried by the bcrypt_pbkdf fork:
      # the Feistel round indexes the S-boxes by the bytes of a uint32 and the
      # block is split back into bytes the same way. Same reasoning as above.
      - path: internal/bcryptpbkdf/blowfish\.go
        linters: [gosec]
        text: "G115"

      # Tests legitimately exercise error paths, panics, and unsafe probes.
      - path: _test\.go
        linters: [gosec, errcheck, unparam]

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
